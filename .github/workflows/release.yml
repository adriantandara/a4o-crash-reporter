name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Versiune
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" Cargo.toml || { echo "Tag-ul nu corespunde cu Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: cargo test --release --locked --workspace
      - run: cargo build --release --locked

      - name: Exe pentru semnare
        id: unsigned-exe
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: target/release/a4o-crash-reporter.exe

      - name: Semnare exe (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: a4o-crash-reporter
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/release

      - name: Installer
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          mkdir -p dist
          cp target/release/a4o-crash-reporter.exe "dist/ALL4ONE-Crash-Reporter-${{ steps.version.outputs.version }}.exe"
          wix build installer/package.wxs -arch x64 -culture ro-RO \
            -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext \
            -d Version=${{ steps.version.outputs.version }} \
            -o "dist/ALL4ONE-Crash-Reporter-${{ steps.version.outputs.version }}.msi"
          rm -f dist/*.wixpdb

      - name: Msi pentru semnare
        id: unsigned-msi
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msi
          path: dist/*.msi

      - name: Semnare msi (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: a4o-crash-reporter
          signing-policy-slug: release-signing
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Sume de control
        shell: bash
        run: (cd dist && sha256sum *.exe *.msi > SHA256SUMS.txt)

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.msi

      - name: VirusTotal
        id: virustotal
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/*.exe
            dist/*.msi

      - name: Note
        shell: bash
        run: |
          {
            echo "## Verificare"
            echo
            echo "Sume SHA-256: \`SHA256SUMS.txt\`."
            echo
            echo "Atestare de build: \`gh attestation verify <fisier> --repo ${{ github.repository }}\`"
            echo
            if [ "$SIGNPATH_ENABLED" = "true" ]; then
              echo "Semnătură digitală: SignPath Foundation."
              echo
            fi
            if [ -n "${{ steps.virustotal.outputs.analysis }}" ]; then
              echo "### VirusTotal"
              echo
              echo "${{ steps.virustotal.outputs.analysis }}" | tr ',' '\n' | sed -E 's#^([^=]+)=(.*)$#- [\1](\2)#; s#dist/##'
            fi
          } > dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: dist/notes.md
          files: |
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS.txt
