[package]
name = "a4o-crash-reporter"
version = "0.1.0"
edition = "2024"
description = "ALL4ONE Crash Reporter"
license = "MIT"
repository = "https://github.com/adriantandara/a4o-crash-reporter"
publish = false

[features]
local = []

[workspace]
members = [".", "tools/release-sign"]

[dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
miniz_oxide = { version = "0.8", features = ["std"] }
serde_json = "1"
sha2 = "0.10"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
